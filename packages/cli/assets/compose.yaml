services:
  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: hex
      POSTGRES_PASSWORD: hex-local-only
      POSTGRES_DB: hex
    ports:
      - "127.0.0.1:${HEX_LOCAL_POSTGRES_PORT:-54320}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U hex -d hex"]
      interval: 2s
      timeout: 3s
      retries: 30

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    profiles: [azurite]
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    environment:
      AZURITE_ACCOUNTS: "hexlocal:${HEX_LOCAL_BLOB_KEY:-aGV4LWxvY2FsLWRldmVsb3BtZW50LW9ubHk=}"
    ports:
      - "127.0.0.1:${HEX_LOCAL_BLOB_PORT:-10000}:10000"
    volumes:
      - blob-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const socket = require('node:net').connect(10000, '127.0.0.1', () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));"
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  blob-data:
